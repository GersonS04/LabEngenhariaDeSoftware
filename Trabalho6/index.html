<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Pessoas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contador">
        <h1>Contador de Pessoas</h1>

        <div class="categorias">

            <section class="categoria homens">
                <svg viewBox="0 0 80 110" class="boneco">
                    <circle cx="40" cy="15" r="11" />
                    <rect x="29" y="30" width="22" height="40" rx="5" />
                    <rect x="17" y="33" width="10" height="38" rx="5" />
                    <rect x="53" y="33" width="10" height="38" rx="5" />
                    <rect x="29" y="67" width="10" height="38" rx="5" />
                    <rect x="41" y="67" width="10" height="38" rx="5" />
                </svg>

                <p id="homens" class="numero">0</p>

                <h2>Homens</h2>

                <div class="botoes">
                    <button id="diminuirHomens">−</button>
                    <button id="aumentarHomens">+</button>
                </div>
            </section>

            <section class="categoria mulheres">
                <svg viewBox="0 0 80 110" class="boneco">
                    <circle cx="40" cy="15" r="11" />
                    <path d="M29 30 L51 30 L61 69 L19 69 Z" />
                    <rect x="17" y="33" width="10" height="38" rx="5" />
                    <rect x="53" y="33" width="10" height="38" rx="5" />
                    <rect x="29" y="66" width="10" height="39" rx="5" />
                    <rect x="41" y="66" width="10" height="39" rx="5" />
                </svg>

                <p id="mulheres" class="numero">0</p>

                <h2>Mulheres</h2>

                <div class="botoes">
                    <button id="diminuirMulheres">−</button>
                    <button id="aumentarMulheres">+</button>
                </div>
            </section>

        </div>

        <div class="total">
            <h2>Total de pessoas</h2>
            <p id="total">0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
