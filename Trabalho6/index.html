<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <div class="visor">
            <div id="expressao"></div>
            <div id="resultado">0</div>
        </div>

        <div class="botoes">
            <button class="especial" data-action="limpar">AC</button>
            <button class="especial" data-action="sinal">+/−</button>
            <button class="especial" data-action="porcentagem">%</button>
            <button class="operador" data-action="operador" data-value="/">÷</button>

            <button class="numero" data-number="7">7</button>
            <button class="numero" data-number="8">8</button>
            <button class="numero" data-number="9">9</button>
            <button class="operador" data-action="operador" data-value="*">×</button>

            <button class="numero" data-number="4">4</button>
            <button class="numero" data-number="5">5</button>
            <button class="numero" data-number="6">6</button>
            <button class="operador" data-action="operador" data-value="-">−</button>

            <button class="numero" data-number="1">1</button>
            <button class="numero" data-number="2">2</button>
            <button class="numero" data-number="3">3</button>
            <button class="operador" data-action="operador" data-value="+">+</button>

            <button class="numero zero" data-number="0">0</button>
            <button class="numero" data-action="decimal">,</button>
            <button class="operador" data-action="igual">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
